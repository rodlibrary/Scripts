# Exports selected metadata fields from Preservica to
# preservica/exports/preservica_metadata.csv and commits the file whenever it
# changes. Setup steps are in preservica/README.md.
name: Preservica metadata export

on:
  schedule:
    # Mondays at 11:17 UTC (6:17 am Central daylight time, 5:17 am standard time).
    # GitHub runs schedules in UTC and may start them a few minutes late.
    - cron: "17 11 * * 1"
  workflow_dispatch:
    inputs:
      folder:
        description: "Folder UUID to export. Leave blank to use the PRESERVICA_FOLDER variable (or the whole repository if that isn't set)."
        required: false
        default: ""
      type:
        description: "Which records to export"
        type: choice
        options: [assets, folders, all]
        default: assets

permissions:
  contents: write   # lets the workflow commit the CSV

concurrency:
  group: preservica-metadata-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PRESERVICA_USERNAME: ${{ secrets.PRESERVICA_USERNAME }}
      PRESERVICA_PASSWORD: ${{ secrets.PRESERVICA_PASSWORD }}
      PRESERVICA_TENANT: ${{ secrets.PRESERVICA_TENANT }}
      PRESERVICA_SERVER: ${{ secrets.PRESERVICA_SERVER }}
      FOLDER: ${{ inputs.folder || vars.PRESERVICA_FOLDER }}
      RECORD_TYPE: ${{ inputs.type || 'assets' }}
      OUTPUT: exports/preservica_metadata.csv

    steps:
      - name: Check secrets are set
        run: |
          missing=""
          for name in PRESERVICA_USERNAME PRESERVICA_PASSWORD PRESERVICA_TENANT PRESERVICA_SERVER; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets (Settings > Secrets and variables > Actions):$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyPreservica
        run: python -m pip install pyPreservica requests

      - name: Export metadata
        id: export
        working-directory: preservica
        run: |
          mkdir -p exports
          args=(--fields fields.txt --type "$RECORD_TYPE" --output "$OUTPUT")
          if [ -n "$FOLDER" ]; then
            args+=(--folder "$FOLDER")
            echo "Exporting $RECORD_TYPE under folder $FOLDER"
          else
            echo "Exporting $RECORD_TYPE from the whole repository"
          fi
          python preservica_search_export.py "${args[@]}"

      - name: Commit the CSV if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "preservica/$OUTPUT"
          if git diff --cached --quiet; then
            echo "No metadata changes since the last export."
            exit 0
          fi
          git commit -m "Update Preservica metadata export ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: steps.export.outcome == 'success'
        run: |
          f="preservica/$OUTPUT"
          if [ -f "$f" ]; then
            rows=$(python -c "import csv,sys; print(sum(1 for _ in csv.reader(open(sys.argv[1], encoding='utf-8-sig'))) - 1)" "$f")
            echo "Exported **$rows** records to \`$f\`." >> "$GITHUB_STEP_SUMMARY"
          fi

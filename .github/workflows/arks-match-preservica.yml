# Weekly (and by hand). Fills in the Preservica reference of each ARK in the
# resolver's resolve.csv (github.com/rodlibrary/Resolver), from the ARKs in
# Preservica's MODS (Archival Resource Key and Location (URL)), and pushes
# resolve.csv back when it changed. Setup steps are in arks/README.md.
#
# This repository is public, so the log shows only counts. The per-asset match
# report is pushed to the resolver repository (also public) instead.
name: ARKs - match Preservica references

on:
  schedule:
    # Mondays 13:23 UTC: 7:23 am Central in winter, 8:23 am in summer.
    - cron: "23 13 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only: don't change resolve.csv in the resolver repository"
        type: boolean
        default: false
      overwrite:
        description: "Replace a preservica_ref or target_url that differs from what Preservica says"
        type: boolean
        default: false

# This workflow's own token only reads this repository. Writing to
# rodlibrary/Resolver uses the RESOLVER_TOKEN secret.
permissions:
  contents: read

concurrency:
  group: arks-resolver
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PRESERVICA_USERNAME: ${{ secrets.PRESERVICA_USERNAME }}
      PRESERVICA_PASSWORD: ${{ secrets.PRESERVICA_PASSWORD }}
      PRESERVICA_TENANT: ${{ secrets.PRESERVICA_TENANT }}
      PRESERVICA_SERVER: ${{ secrets.PRESERVICA_SERVER }}
      GITHUB_TOKEN: ${{ secrets.RESOLVER_TOKEN }}
      RESOLVER_REPO: ${{ vars.RESOLVER_REPO || 'rodlibrary/Resolver' }}
      RESOLVER_BRANCH: ${{ vars.RESOLVER_BRANCH || 'main' }}
      PRESERVICA_PORTAL_URL: ${{ vars.PRESERVICA_PORTAL_URL }}
      DRY_RUN: ${{ (inputs.dry_run || vars.DRY_RUN == 'true') && '--dry-run' || '' }}
      OVERWRITE: ${{ inputs.overwrite && '--overwrite' || '' }}

    steps:
      - name: Check secrets are set
        run: |
          missing=""
          for name in PRESERVICA_USERNAME PRESERVICA_PASSWORD GITHUB_TOKEN; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          missing="${missing/GITHUB_TOKEN/RESOLVER_TOKEN}"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets (Settings > Secrets and variables > Actions > Secrets):$missing"
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Self-test (offline)
        run: python -m unittest discover -s arks/tests

      - name: Match ARKs in Preservica and update the resolver
        working-directory: arks
        run: python match_preservica.py --from-github --push-to-github --push-report $DRY_RUN $OVERWRITE
